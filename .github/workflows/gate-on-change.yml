# Everything deterministic. No quota, no credential, no environment.
#
# Specified by docs/design/ci_pipeline.md section 3. This file names no secret
# and no environment, which is the STRUCTURAL half of A1: a secret held in an
# environment is unreachable from a workflow that does not name it, so there is
# no conditional to get wrong and no path by which a pull request from a fork
# reaches one.
name: gate-on-change

on:
  push:
  pull_request:
  # A maintainer can run the full suite on a branch without opening a pull
  # request. A manual dispatch here is GATED: it carries run_context ci,
  # supplies no filter, and therefore derives selection_mode full. Design
  # section 3.5 gives the reason that differs from a diagnostic run.
  workflow_dispatch:

# Superseded pull request runs are cancelled. Safe here because nothing in this
# workflow spends quota or writes anything a later run depends on. This is the
# OPPOSITE of evaluate-live-weekly.yml, where a cancelled run has already spent
# its quota and leaves a partial record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Gate 1. Blocks everything: a naming violation is a build failure, not a
  # warning. actionlint covers the YAML, which pytest never collects and
  # pylint is never run against.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      # One platform's failure must not cancel the other, or a pass on one
      # masks a failure on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The default depth of 1 makes the selection diff fail or return
          # nothing, and an empty result is indistinguishable from "nothing
          # changed", which would select no tests at all.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # From pyproject.toml, the single declaration. requirements.txt is
      # generated from it for tooling that expects one, and MQC_CMN_UNI_112222
      # fails the run when the two disagree.
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Gate 1, static analysis and naming
        run: python -m pylint ingestion/ execution/ evaluation/ cmn/ tests/ tools/ conftest.py --rcfile=.pylintrc
      - name: Lint workflow definitions
        if: runner.os == 'Linux'
        uses: raven-actions/actionlint@v2

  # Gate 2. Ungraded precondition: 100% pass, zero skips. A unit test has
  # nothing external to block it, so a skip means something is broken.
  unit:
    name: unit (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # From pyproject.toml, the single declaration. requirements.txt is
      # generated from it for tooling that expects one, and MQC_CMN_UNI_112222
      # fails the run when the two disagree.
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Gate 2, unit preconditions
        run: pytest -m unit --junitxml=reports/junit_mqc_unit.xml --alluredir=reports/allure-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-unit-none-replay-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # Gate 3. Replay mode always: a precondition that can flake is not a
  # precondition, so it never runs live here.
  system:
    name: system (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # From pyproject.toml, the single declaration. requirements.txt is
      # generated from it for tooling that expects one, and MQC_CMN_UNI_112222
      # fails the run when the two disagree.
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Gate 3, system preconditions
        run: pytest -m system --mode replay --junitxml=reports/junit_mqc_system.xml --alluredir=reports/allure-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-system-none-replay-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # GATES 4 TO 7 ARE NOT HERE, AND THAT IS THE BOUNDARY RATHER THAN AN OMISSION.
  # They ran `pytest -m evaluator`, `-m tool` and `-m sec` and then computed a
  # verdict. This repository contains no graded case: CLAUDE.md states that the
  # harness owns no case data, and the cases live in AP-Model-QC. So all three
  # markers collected nothing, pytest exited 5, and Gate 7 read a
  # `collected/results.json` that nothing in this repository writes, because
  # section 5 of cmn_verdict_and_cli.md emits observations as Allure and JUnit
  # for a downstream collector. Gate 1 failed first on the first commit that ran
  # this workflow, so all four were skipped and none of it had ever surfaced.
  #
  # WHERE EACH ONE LIVES NOW:
  #   Gates 4 to 6   AP-Model-QC's own gate-on-change.yml, against its cases.
  #   Gate 7         The same, where a model has actually been measured.
  #   This harness    regress-consumers-on-merge.yml, which checks out a
  #                   consumer against this candidate and runs the consumer's
  #                   deterministic gates. That is how a change here is proved
  #                   not to break a model run.
  #
  # WHAT REPLACES THEM AS PROOF THE HARNESS WORKS: `MQC_CMN_SYS_122000` through
  # `122002`, in Gate 3. They run the whole chain on a synthetic corpus, from the
  # ingestion join through dispatch and the dual pass to a computed verdict, and
  # assert that it reaches BOTH a green and a red. A harness that cannot report
  # red about a failing model cannot be trusted when it reports green, and
  # nothing proved the stages composed until those cases existed.
