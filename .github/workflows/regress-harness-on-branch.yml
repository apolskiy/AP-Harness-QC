# The whole suite on one branch, on demand, gated.
#
# Specified by docs/design/ci_pipeline.md section 3A.
#
# WHAT THE GATE DELIBERATELY DOES NOT DO. gate-on-change.yml scopes a pull
# request run to what the change can affect, which is the right trade for
# something running on every push and leaves a real question unanswered: is this
# branch sound IN FULL, not merely unbroken where it was touched?
#
# THIS RUN IS GATED. It carries run_context ci, supplies no filter and therefore
# derives selection_mode full, so the verdict it produces is the real one. A
# developer running it before opening a pull request learns what the merge run
# would say, a day earlier.
name: regress-harness-on-branch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to regress. Defaults to the dispatching ref"
        required: false
        default: ""
        type: string

run-name: "Full regression on ${{ inputs.ref || github.ref_name }}"

# NOT cancel-in-progress. A regression is asked for deliberately, and cancelling
# one because a second was requested discards the answer somebody was waiting
# for. The gate cancels superseded runs because a newer commit makes an older
# gate result irrelevant; that reasoning does not carry here, where two runs may
# be deliberately comparing two refs.
concurrency:
  group: regress-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Gate 1. Blocks everything, as it does in the gate workflow.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Gate 1, static analysis and naming
        run: python -m pylint ingestion/ execution/ evaluation/ cmn/ tests/ tools/ conftest.py --rcfile=.pylintrc
      - name: Lint workflow definitions
        if: runner.os == 'Linux'
        uses: raven-actions/actionlint@v2

  # Gates 2 through 6 in one job per platform and engine. UNLIKE THE GATE, there
  # is no selection step and no --priority: a regression that filtered anything
  # would answer a narrower question than the one it was asked.
  regress:
    name: regress (${{ matrix.engine }}, ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        engine: [gemini, openai, claude]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --editable ".[dev]"

      - name: Gate 2, unit preconditions
        run: pytest -m unit --junitxml=reports/junit_mqc_unit.xml --alluredir=reports/allure-results
      - name: Gate 3, system preconditions
        if: always()
        run: pytest -m system --mode replay --junitxml=reports/junit_mqc_system.xml --alluredir=reports/allure-results
      # GATES 4 TO 6 ARE NOT HERE. They collected nothing: this repository holds
      # no graded case, because the harness owns no case data (CLAUDE.md). A
      # marker matching zero tests exits 5, so all three failed the job they were
      # meant to complete. What regresses a harness change against real cases is
      # regress-consumers-on-merge.yml, which checks out a consumer against this
      # candidate. What proves the harness composes is Gate 3, which now carries
      # MQC_CMN_SYS_122000 to 122002: the whole chain, to both a green and a red.

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # Carries the collector prefix, because this run IS part of the
          # durable record. That is the difference from a diagnostic run.
          name: mqc-reports-regress-${{ matrix.engine }}-replay-${{ matrix.os }}
          path: reports/
          retention-days: 90

  # THE VERDICT JOB IS NOT HERE EITHER. It ran `cmn.verdict_tool` against
  # `collected/results.json`, a file no part of this repository writes: section 5
  # of cmn_verdict_and_cli.md emits observations as Allure and JUnit for a
  # downstream collector to assemble. A verdict is also a statement about a
  # model, and this workflow measures none.
