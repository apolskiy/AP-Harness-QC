# Finding out before the consumer does.
#
# Specified by docs/design/harness_ci_pipeline.md sections 3B and 3C.
#
# THIS IS THE FAN-OUT THE SPLIT EXISTS FOR. A harness change is verified here
# against this repository's own preconditions. Those prove the instrument works;
# they say nothing about whether a case set pinning this harness still passes.
#
# Split, that question is answerable: a harness candidate runs against every
# case repository declaring compatibility with it, which is how a library learns
# it broke a consumer before the consumer does.
#
# IT FIRES FROM A GREEN GATE, NOT FROM A PUSH. Fanning out from a commit whose
# own gate failed spends a consumer's CI to discover that a harness we already
# know is broken is broken. That matters most on the stabilization branch, which
# is red by design while it is being stabilized, and it is the same rule the
# consumer applies in the other direction under section 3C.
name: regress-consumers-on-merge

# NAMED BY THE GATE RUN THAT STARTED IT. A workflow_run is labelled with the
# newest commit on the default branch, so a run started by a cancelled gate
# read as a run on a later commit. The name carries the commit the gate ran
# on and how it ended (design section 3B.3.3).
run-name: >-
  ${{ github.event_name == 'workflow_run'
  && format('regress after gate on {0}: {1}', github.event.workflow_run.head_sha,
  github.event.workflow_run.conclusion)
  || format('regress on {0} ({1})', github.sha, github.event_name) }}

on:
  workflow_run:
    workflows: [gate-on-change]
    types: [completed]
    branches: [main, "stabilization-*"]
  # NO SCHEDULE UNTIL MAIN IS STABLE, decided 2026-09-26. A cron firing against
  # an unstabilized main produces a weekly red nobody acts on, and it spends
  # provider quota on a branch still moving. Weekly regression is set up once
  # main is stable, and this stanza returns then.
  workflow_dispatch:

concurrency:
  group: consumers-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # The registry is read once and turned into a matrix, so adding a consumer is
  # an entry in config/consumers.yaml rather than a change here.
  enumerate:
    name: read the consumer registry
    runs-on: ubuntu-26.04
    # A gate that did not conclude success says nothing was established about
    # this commit, so there is nothing to fan out from. The schedule and a
    # manual dispatch carry no workflow_run payload and are unaffected.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      consumers: ${{ steps.read.outputs.consumers }}
      harness_sha: ${{ steps.read.outputs.harness_sha }}
      harness_branch: ${{ steps.read.outputs.harness_branch }}
    steps:
      # THE COMMIT, NOT THE BRANCH. A workflow_run payload names the commit its
      # gate actually passed on, and the branch may already have moved past it.
      # Checking out the branch here would fan out from a commit no gate has
      # seen, which is the window section 3C.2 closes on the consumer side.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # PYYAML, AND NOTHING ELSE. This job only reads the consumer registry to
      # build the matrix, so it needs a YAML parser and nothing from the harness
      # it is about to hand to a consumer.
      #
      # The version matches the `pyyaml` pin in `pyproject.toml`; it is repeated
      # here because a workflow cannot read that file before Python is installed.
      - name: Install PyYAML for the registry read
        run: python -m pip install --quiet "pyyaml>=6.0,<7.0"
      - name: Build the matrix
        id: read
        shell: bash
        env:
          HARNESS_BRANCH: >-
            ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HARNESS_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        # A PROGRAM IN A FILE, run by path. This step held 20 lines of Python
        # piped to an interpreter reading standard input through a
        # here-document, which is two of the four shapes `code-style.md`
        # section 8.1 bans and which pylint never saw, although it decides
        # which consumer refs this candidate is verified against. The pairing
        # fallback to `default_ref` is why it is a program at all and not a
        # matrix expression. Design section 8.10.
        run: >-
          python -m tools.enumerate_consumers
          --branch "$HARNESS_BRANCH"
          --sha "$HARNESS_SHA"
          --output "$GITHUB_OUTPUT"

  verify:
    name: verify ${{ matrix.consumer.name }} (${{ matrix.consumer.ref }})
    needs: enumerate
    if: needs.enumerate.outputs.consumers != '[]'
    runs-on: ubuntu-26.04
    strategy:
      # One consumer failing says nothing about the others, and cancelling the
      # rest would discard the answer for every consumer that was fine.
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.enumerate.outputs.consumers) }}
    steps:
      # TWO COMMITS, SO THE ONE BEFORE THE CHANGE CAN BE NAMED. The graded
      # replay runs against both and only a difference fails this job
      # (design section 3B.3.1).
      - name: Check out this harness candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.enumerate.outputs.harness_sha }}
          path: harness
          fetch-depth: 2

      # THE FIRST PARENT IS THE HARNESS BEFORE THE CHANGE. The consumer pins
      # `main`, which by now is the candidate, so its pin cannot be the
      # baseline. A candidate with no parent fails here, and the comparison
      # refuses rather than passing.
      - name: Name the harness before the change
        id: parent
        shell: bash
        run: echo "sha=$(git -C harness rev-parse HEAD^)" >> "$GITHUB_OUTPUT"

      - name: Check out the harness before the change
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.parent.outputs.sha }}
          path: harness_baseline

      # A CONSUMER THAT CANNOT BE REACHED IS A HARNESS EVENT. A private
      # repository, a deleted branch or a rate-limited clone says nothing about
      # whether this harness is sound, so the step records it and continues.
      #
      # A paired branch that does not exist yet is the ordinary case here: a
      # consumer need not carry a stabilization branch merely because we do.
      - name: Check out the consumer
        id: fetch
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.consumer.repository }}
          ref: ${{ matrix.consumer.ref }}
          path: consumer

      - name: Report an unreachable consumer
        if: steps.fetch.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## ${{ matrix.consumer.name }}: unreachable"
            echo ""
            echo "QC_HARNESS_DEPENDENCY_UNMET: could not check out"
            echo "${{ matrix.consumer.repository }} at ${{ matrix.consumer.ref }},"
            echo "paired with harness ${{ needs.enumerate.outputs.harness_branch }}."
            echo ""
            echo "A paired branch that does not exist yet is ordinary: a consumer"
            echo "need not carry a stabilization branch because we do."
            echo ""
            echo "This is a HARNESS event, not a finding about the harness under"
            echo "test. Nothing was measured for this consumer, and no other"
            echo "consumer's result is affected."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        if: steps.fetch.outcome == 'success'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the consumer against THIS harness
        if: steps.fetch.outcome == 'success'
        shell: bash
        run: |
          # The candidate replaces whatever the consumer pins. That substitution
          # is the entire experiment: the consumer's own cases, run against the
          # harness as it stands here rather than as it stands on the ref the
          # consumer declared.
          # THE `[dev]` EXTRA IS WHAT INSTALLS THE TOOLCHAIN. Without it the
          # consumer's gate reported `pytest: command not found`, exit 127, which
          # read as a consumer failure and was ours. The consumer stays
          # `--no-deps` so its own harness pin cannot replace this candidate.
          python -m pip install --quiet --editable "./harness[dev]"
          python -m pip install --quiet --no-deps --editable ./consumer

      # `--out-dir` SUPPLIES THE ALLURE DESTINATION AND LEAVES THE JUNIT NAME
      # ALONE. Both artifacts are mandated by `testing-standards.md` section 5
      # and this step emitted only JUnit, so the consumer regression produced
      # no report to read. The distinct JUnit name is kept because an explicit
      # flag wins: four matrix legs would otherwise overwrite one file.
      # Design `cmn_verdict_and_cli.md` section 7.1.0.2.
      - name: Run the consumer's deterministic gates
        if: steps.fetch.outcome == 'success'
        working-directory: consumer
        run: >-
          ${{ matrix.consumer.command }}
          --out-dir reports/
          --junitxml=reports/junit_consumer.xml

      # THE GRADED PATH TOO, AND IT WAS NOT RUN BEFORE. Two of the three
      # harness defects that reached the consumer on 2026-09-28 broke this and
      # not the deterministic gates, so both were found when the consumer's own
      # gate went red after a later push. A replay contacts no provider and
      # takes under two seconds, so the argument for excluding it was never
      # cost. Design `harness_ci_pipeline.md` section 3B.3.
      #
      # IT DOES NOT GATE BY ITSELF. The consumer carries findings about the
      # model; the comparison below decides whether our change altered any.
      - name: Replay the consumer's graded layers
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        working-directory: consumer
        shell: bash
        run: |
          pytest -m "evaluator or tool or sec" \
            --engine gemini \
            --mode replay \
            --out-dir reports/ \
            --junitxml=reports/junit_consumer_graded.xml

      # THE SAME REPLAY ON THE HARNESS BEFORE THE CHANGE. It replaces the
      # installed harness, so it runs after every step that needs the
      # candidate. A failed install leaves no report, and the comparison
      # refuses.
      - name: Replay the consumer's graded layers on the harness before the change
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        working-directory: consumer
        shell: bash
        run: |
          python -m pip install --quiet --editable "../harness_baseline[dev]"
          pytest -m "evaluator or tool or sec" \
            --engine gemini \
            --mode replay \
            --out-dir reports/baseline/ \
            --junitxml=reports/baseline/junit_consumer_graded.xml

      # A CHANGED OUTCOME FAILS THIS JOB, WHATEVER ITS CODE. A replay sends
      # nothing to a model, so a case whose outcome differs across the change
      # was changed by the harness; one that matches is the consumer's to
      # review. Section 3B.3.1 carries the table.
      - name: Fail on any outcome the change altered
        if: steps.fetch.outcome == 'success'
        # THE HARNESS IS CHECKED OUT TO `harness/`, so the tool is not at the
        # workspace root. Design section 3B.3.2: this step invoked the root
        # path and could never start, which left the gate reporting success
        # while evaluating nothing.
        # THE RUN PAGE SAYS WHAT WAS COMPARED: both commits, both sides'
        # counts, the verdict and every changed case (section 3B.3.3). The
        # commits arrive through the environment, not an expression in the
        # script, so `MQC_CMN_UNI_112524` still resolves the script path.
        env:
          BASELINE_COMMIT: ${{ steps.parent.outputs.sha }}
          CANDIDATE_COMMIT: ${{ needs.enumerate.outputs.harness_sha }}
        run: >-
          python harness/tools/consumer_regression.py
          consumer/reports/baseline/junit_consumer_graded.xml
          consumer/reports/junit_consumer_graded.xml
          --summary "$GITHUB_STEP_SUMMARY"
          --baseline-commit "$BASELINE_COMMIT"
          --candidate-commit "$CANDIDATE_COMMIT"

      - uses: actions/upload-artifact@v6
        if: always() && steps.fetch.outcome == 'success'
        with:
          name: mqc-reports-consumer-${{ matrix.consumer.name }}-none-replay
          path: consumer/reports/
          retention-days: 90

  # A CONSUMER FAILURE DOES NOT BLOCK THIS REPOSITORY'S MERGE. By the time this
  # runs, the merge has happened. What it produces is the earliest possible
  # notice that a consumer needs attention, which is strictly more than the
  # consumer would have had.
  #
  # Treating it as a blocker would also invert the dependency: a case repository
  # could hold the harness hostage by carrying a failing case, and the harness
  # could not release the fix for it.
  report:
    name: report
    needs: [enumerate, verify]
    # `always()` is what lets this report a fan-out that failed rather than one
    # that passed. The second clause is what stops it reporting a fan-out that
    # never happened: with the registry job skipped behind a red gate, every
    # job here is skipped and the run concludes skipped, which is neither
    # success nor failure. Without it this job succeeded alone and the run
    # concluded success on a commit nothing had been run against
    # (section 3B.2.1).
    if: always() && needs.enumerate.result != 'skipped'
    runs-on: ubuntu-26.04
    steps:
      - name: Summarise
        shell: bash
        run: |
          {
            echo "## Consumer fan-out: ${{ needs.verify.result }}"
            echo ""
            echo "Harness branch: ${{ needs.enumerate.outputs.harness_branch }}"
            echo "Harness commit: ${{ needs.enumerate.outputs.harness_sha }}"
            echo ""
            echo "A failure here is NOT a merge blocker for this repository. The"
            echo "merge has already happened; this is the earliest notice that a"
            echo "consumer needs attention."
            echo ""
            echo "Treating it as a blocker would invert the dependency: a case"
            echo "repository carrying a failing case could stop the harness"
            echo "releasing the fix for it."
          } >> "$GITHUB_STEP_SUMMARY"
