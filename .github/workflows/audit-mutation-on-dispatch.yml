# Gate 8: which tests the tests.
#
# Specified by docs/design/harness_ci_pipeline.md section 5A and
# docs/design/harness_test_taxonomy.md section 15.
#
# A HARNESS UPDATE IS THE EVENT AN AUDIT ANSWERS. A survivor describes code as
# it stands, so this runs when that code, the suite, the audit or its manifest
# changes on main, and on demand. NO SCHEDULE UNTIL MAIN IS STABLE, the rule
# section 2.0.1 sets for every workflow.
#
# THE CHEAP QUESTION IS ASKED FIRST. A measurement costs minutes per module and
# the comparison deciding whether it is worth starting costs six hashes, so the
# declarations are compared before anything is measured and a manifest that
# does not describe this commit stops the job there (taxonomy section 15.7.2).
#
# IT BLOCKS NOTHING AND IS NOT A REQUIRED CHECK. A survivor is a fact about
# coverage rather than about what a run measured (taxonomy section 15.6). It
# does go red: on an undeclared survivor, on a declaration that no longer
# survives, and on an audit that refused (taxonomy section 15.7.1).
name: audit-mutation-on-change

# MANUAL ONLY, at the project owner's ruling of 2026-10-24: "There should be
# no recurring audit job only manual one and only in CI." No push, no path, no
# schedule. The audit measures neither the harness nor a model, and it cost
# about ten hours of project time in the week before this
# (`harness_test_taxonomy.md` section 15.6A).
#
# A SURVIVOR IS A TO-DO LIST ENTRY, not a result to re-derive: once the triple
# that pins the behaviour exists the mutant dies permanently, so an audit over
# unchanged code spends minutes on an answer that cannot have changed.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "The production module to audit, such as cmn/verdict.py"
        required: false
        type: string
      since:
        description: "Audit only the points on lines changed since this ref"
        required: false
        type: string

run-name: "Mutation audit of ${{ inputs.module || 'every audited module' }}"

# AN AUDIT OF A COMMIT MAIN HAS MOVED PAST ANSWERS NOTHING, so a newer push
# supersedes it. Unlike the live run, nothing here has spent anything.
concurrency:
  group: audit-mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  audit:
    name: mutation audit
    # UBUNTU ONLY. Platform coverage is the gate's question; this one asks
    # whether a case would notice a change, which no platform alters.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --editable ".[dev]"

      # SIX HASHES BEFORE MINUTES PER MODULE. One stale declaration used to
      # cost five measurements and about twenty-one minutes, and the job went
      # red anyway: the manifest disagreeing with the repository is not a
      # measurement and nothing below it can be one (taxonomy section 15.7.2).
      - name: Compare the declarations with the modules
        id: declarations
        shell: bash
        run: |
          status=0
          stale=$(python -m tools.mutation_declarations 2>&1) || status=$?
          echo "$stale"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          {
            echo "## Mutation audit"
            echo ""
            echo "**Not started.** The manifest does not describe the modules on disk,"
            echo "so nothing here could measure the commit that triggered it."
            echo ""
            echo "$stale"
            echo ""
            echo "Re-measure each module named above and declare its digest, then push again."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Gate 8, mutation audit
        id: audit
        run: pytest -m mutation tests/mutation --junitxml=reports/junit_mqc_mutation.xml --alluredir=reports/allure-results

      # A REFUSAL IS A SKIP AT THE CASE AND RED AT THE JOB. The edit that
      # triggered this run usually invalidates the edited module's digest, and
      # a green job over audits that did not run would say the change was
      # measured (taxonomy section 15.7.1).
      #
      # AND THE SUMMARY STATES WHAT IT TOOK. The history this gate came from
      # was legible only as a duration, twenty-one minutes green and then
      # thirty-one seconds red four times over, and nothing read that number.
      # No floor is asserted: runner speed is not ours, and what is worth
      # checking is whether every audited module was measured.
      - name: Report what was measured, and what refused
        if: always()
        shell: bash
        run: |
          report=reports/junit_mqc_mutation.xml
          if [ ! -f "$report" ]; then
            echo "no measurement ran, so there is nothing to report"
            exit 0
          fi
          elapsed=$(( $(date +%s) - ${{ steps.declarations.outputs.started }} ))
          audits=$(grep -o '<testcase ' "$report" | wc -l || true)
          skipped=$(grep -o '<skipped' "$report" | wc -l || true)
          refused=$(grep -o 'QC_HARNESS_AUDIT_REFUSED[^"&]*' "$report" || true)
          # WHAT THE AUDIT SET ASIDE, read from the tool rather than restated
          # here, so one list is reported from one place (section 15.7.1.2).
          quarantined=$(python -m tools.mutation_audit --quarantined || true)
          {
            echo "## Mutation audit"
            echo ""
            echo "Measured $(( audits - skipped )) of $audits audits in $(( elapsed / 60 ))m $(( elapsed % 60 ))s."
            echo ""
            if [ -n "$refused" ]; then
              echo "**Refused, so not measured.** Re-measure and re-declare each digest:"
              echo ""
              echo "- ${refused//$'\n'/$'\n'- }"
            else
              echo "Every audited module was measured."
            fi
            if [ -n "$quarantined" ]; then
              echo ""
              echo "$quarantined, because each reads source or the manifest as"
              echo "text and the control rewrites both."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$refused" ]; then
            exit 1
          fi

      # OUTSIDE THE COLLECTOR'S PATTERN, so a coverage audit never reads as a
      # measurement of anything (section 5A).
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-audit-${{ github.sha }}
          path: reports/
          retention-days: 90
