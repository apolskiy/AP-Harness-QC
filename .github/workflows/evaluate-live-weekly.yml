# The only workflow that spends.
#
# Specified by docs/design/harness_ci_pipeline.md section 5.
#
# THE WEEKLY RUN IS UNCONDITIONAL because a version string is not a guarantee.
# Providers revise a model behind a stable identifier, so the nightly probe
# reporting no change is evidence rather than proof. This is the same structure
# as change-scoped pull request runs backstopped by a full run on merge: a cheap
# detector is only safe when something unconditional stands behind it.
name: evaluate-live-weekly

on:
  # NO SCHEDULE UNTIL MAIN IS STABLE, decided 2026-09-26. A cron firing against
  # an unstabilized main produces a weekly red nobody acts on, and it spends
  # provider quota on a branch still moving. Weekly regression is set up once
  # main is stable, and this stanza returns then.
  workflow_dispatch:
    inputs:
      max_spend:
        description: "USD ceiling for this run. The monthly cap is $20 per provider"
        required: false
        default: "2.00"
        type: string
      engine:
        description: "Single engine to evaluate, empty for all"
        required: false
        default: ""
        type: string
      reason:
        description: "Why this run was dispatched"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # GATE 2 AND GATE 3 STAND IN FRONT OF THE SPEND, which is where they were
  # missing. `framework-rules.md` section 1 makes a precondition failure stop
  # the graded layers and this workflow needed nothing at all, so a corpus that
  # had stopped loading would have been measured live: on 2026-10-24 one did
  # stop loading and four engine sweeps measured it, because the graded suite
  # builds one case at a time and only a corpus-wide check sees a dangling
  # reference. Design `harness_ci_pipeline.md` section 8.6.
  #
  # A JOB RATHER THAN A STEP INSIDE `evaluate`. The job name is the diagnosis:
  # a red here says nothing was measured and no quota was spent, which is a
  # different remedy from a graded red (`consumer_ci.md` section 3.12). It also
  # runs once rather than once per matrix leg.
  preconditions:
    name: preconditions, not a model finding
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - name: Gate 2, the unit preconditions
        run: pytest -m unit --junitxml=reports/junit_mqc_unit.xml --alluredir=reports/allure-results
      - name: Gate 3, the system preconditions in replay
        run: pytest -m system --mode replay --junitxml=reports/junit_mqc_system.xml --alluredir=reports/allure-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-live-preconditions
          path: reports/
          retention-days: 90

  evaluate:
    name: evaluate (${{ matrix.engine }}, ${{ matrix.mode }})
    # NOTHING LIVE RUNS BEHIND A RED INSTRUMENT. The default needs-success
    # gating is what is wanted here, unlike the case repository's bands: there
    # the bands report independently and name the precondition result, and here
    # a refusal upstream should skip the spend rather than report it.
    needs: preconditions
    # Ubuntu only. PLATFORM COVERAGE TESTS THE HARNESS, NOT THE MODEL: a second
    # platform here doubles quota consumption and learns nothing new about the
    # model, while gate-on-change.yml has already established that our code
    # behaves identically on both.
    runs-on: ubuntu-26.04
    environment: live
    strategy:
      fail-fast: false
      # max-parallel ORDERS LEGS WITHIN A RUN. It is not interchangeable with
      # concurrency: a concurrency group holds exactly one pending job, so
      # placing legs in one makes them contend for a single waiting slot and the
      # losers surface as cancelled, which reads as failure.
      max-parallel: 1
      matrix:
        include:
          # Live: free tier, serving as both judge and candidate, per A3.
          - engine: gemini
            mode: live
          # OPENAI STAYS ON REPLAY THOUGH ITS KEY IS NOW FUNDED (2026-09-28).
          # The pairing was originally forced by A3, and now it is a choice: a
          # live leg here bills at roughly twice the flash rate for the same
          # corpus, and nothing yet establishes that a second engine measures
          # anything the first does not. Moving it to live is a one-word change
          # and a budget decision, which is the point of keeping --engine and
          # --mode orthogonal.
          - engine: openai
            mode: replay
          # Claude has no key, so this one is still forced rather than chosen.
          - engine: claude
            mode: replay
    # concurrency PREVENTS OVERLAP BETWEEN RUNS. Keyed on engine AND mode so a
    # replay leg never waits on a live one, since they contend for nothing.
    concurrency:
      group: live-${{ matrix.engine }}-${{ matrix.mode }}
      # Unlike gate-on-change.yml. A cancelled live run has already spent its
      # quota and leaves a partial record.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # From pyproject.toml, the single declaration. requirements.txt is
      # generated from it for tooling that expects one, and MQC_CMN_UNI_112222
      # fails the run when the two disagree.
      - name: Install
        run: python -m pip install --editable ".[dev]"

      - name: Skip engines not selected by this dispatch
        id: selection
        env:
          REQUESTED: ${{ inputs.engine }}
        shell: bash
        run: |
          if [ -n "${REQUESTED}" ] && [ "${REQUESTED}" != "${{ matrix.engine }}" ]; then
            echo "run_leg=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_leg=true" >> "$GITHUB_OUTPUT"
          fi

      # ONE STEP NAMING EVERY GRADED LAYER. This was three steps, one per
      # layer, and each recorded `selection_mode: full` while selecting a third
      # of the graded cases, so each would have carried a verdict over part of
      # a run (`cmn_verdict_and_cli.md` section 7.1.4, `consumer_ci.md` section
      # 4.21). The three per-gate report names went with gates 4 to 6
      # themselves when they moved to the case repository.
      - name: Gates 4 to 6, the graded layers
        if: steps.selection.outputs.run_leg == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest -m "evaluator or tool or sec" --engine ${{ matrix.engine }} --mode ${{ matrix.mode }} --max-spend "${{ inputs.max_spend || '2.00' }}" --junitxml=reports/junit_mqc_graded.xml --alluredir=reports/allure-results

      - uses: actions/upload-artifact@v6
        if: always() && steps.selection.outputs.run_leg == 'true'
        with:
          # The collector pattern anchors on mqc-reports-. The name must stay
          # stable across runs: renaming a published artifact breaks downstream
          # history, and nothing downstream can tell a rename from a gap.
          name: mqc-reports-graded-${{ matrix.engine }}-${{ matrix.mode }}
          path: reports/
          retention-days: 90

  verdict:
    name: verdict
    needs: evaluate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # From pyproject.toml, the single declaration. requirements.txt is
      # generated from it for tooling that expects one, and MQC_CMN_UNI_112222
      # fails the run when the two disagree.
      - name: Install
        run: python -m pip install --editable ".[dev]"
      - uses: actions/download-artifact@v7
        with:
          pattern: mqc-reports-*
          path: collected/
      # RED HERE IS AN ALERT, NOT A BLOCK. On a scheduled live run, red means
      # the model regressed; on a pull request against frozen fixtures, it means
      # our code changed a frozen outcome. The verdict function does not know
      # which it is running in, and that is deliberate: putting CI topology into
      # a pure computation would couple them.
      - name: Compute the verdict
        shell: bash
        run: |
          set +e
          python -m cmn.verdict_tool collected/results.json
          code=$?
          set -e
          {
            echo "## Weekly live evaluation"
            echo ""
            echo "Reason: ${{ inputs.reason || 'weekly schedule' }}"
            echo ""
            echo "A red verdict here is an ALERT, not a merge block: it says the model"
            echo "moved, which is the finding this run exists to produce."
            echo ""
            echo "Exit code: ${code}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${code}"
