[pytest]
# THE MUTATION SUITE IS NOT IN testpaths. It spawns a pytest process per
# mutation point and costs minutes per module, so a bare `pytest` must not
# collect it: it is selected by `-m mutation` with its own path.
testpaths = tests
python_files = mqc_*.py
python_classes = TestMQC*
python_functions = MQC_*

# STRICT MARKERS, 2026-10-13. An applied marker that is not registered
# below was a PytestUnknownMarkWarning on a passing run, and a warning
# is not a test result. It is a collection error now, which closes both
# directions of a rename between this file and the code that applies
# the marker. harness_test_taxonomy.md section 7.5.1.
addopts = -v --tb=short --strict-markers

# EVERY PASSING ASSERTION IS REPORTED, so the recorder can make it a
# verification step (harness_test_taxonomy.md section 8.2.4).
enable_assertion_pass_hook = true

# A WARNING IS NOT A TEST RESULT, and this one is not ours. `google.genai`
# deprecates `_UnionGenericAlias` against Python 3.17 in its own module at
# import time, so every run of every suite ended "1 warning" in a line
# otherwise listing outcomes. The project owner's correction, 2026-10-07.
#
# NARROW ON PURPOSE: the message, the category and the module. Anything else
# `google.genai` warns about, and every warning from our own code, still
# surfaces. A blanket ignore would buy a clean line by turning the mechanism
# off.
# THE STEP LEDGER REACHES THE JUNIT XML, not only Allure. Allure is the
# picture a manager reads; the people fixing a failure read the JUnit
# artifact, so the numbered steps go into <system-out> where a developer
# already looks. harness_test_taxonomy.md section 8.
junit_logging = log
# INFO, BECAUSE THE LEDGER IS NOT A WARNING. Capture defaults to WARNING,
# so the step lines never reached the artifact. Paired with
# junit_log_passing_tests below this costs nothing on a green case and
# gives a failing one its surrounding log, which is what a developer
# opening the artifact came for.
log_level = INFO
# THE MESSAGE AND NOTHING ELSE. pytest colours the level name, and those
# escape bytes land in the XML where a parser meets them; the module and
# line number are noise beside a line that already carries the case, the
# step, the phase, the outcome and the code.
log_format = %(message)s
junit_log_passing_tests = False

filterwarnings =
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types

markers =
    unit: Fast unit tests for ingestion and helper modules
    system: Multi-model dispatch and integration pipeline tests
    evaluator: LLM-as-a-Judge rubric and scoring tests
    tool: Tool-use compliance - required tools invoked, forbidden tools avoided
    sec: Model security behaviour - injection resistance, prompt leakage, tool coercion
    base: Foundational test - dependents do not execute if this fails
    depends_on: Names the five-digit identifiers this case presupposes
    inquest: Dispatched although its foundation failed, so the result is unattributed
    priority: Test priority P0-P4; P0/P1 must pass for a green run
    environment: Names the environment scope a case needs, deselected where absent
    mutation: Mutation audit of the suite itself - a surviving change is behaviour nothing asserts
    # REGISTERED HERE AND NOT ONLY BY THE REPORTING PLUGIN. The grouping and
    # severity hooks add this marker to every collected item, and the plugin
    # that registers it is an optional dependency: without this line a machine
    # that has no reporter fails every run with an INTERNALERROR under
    # `--strict-markers` (harness_test_taxonomy.md section 16.7).
    allure_label: An Allure label a collection hook derived - epic, feature, story or severity
