# Production changes the suite does not notice, and why each is accepted.
#
# THE RULE IS `docs/design/harness_test_taxonomy.md` SECTION 15. One operator
# or constant is changed and the suite runs: a change nothing fails on is a
# survivor, and a survivor names behaviour nothing asserts.
#
# A GAP IS A DECLARED ABSENCE, NOT AN EXEMPTION, exactly as
# `module_runway.yaml`, `flag_coverage.yaml` and `support_extraction.yaml` are:
# each entry carries a reason and an expiry, because a list with no expiry is
# where unproven things go to be forgotten. An expired entry fails the run.
#
# THE LIST SHRINKS AND NEVER GROWS. An undeclared survivor fails the case, and
# a declared entry that no longer survives fails it too: a declaration
# describing a gap that has been closed is a claim about the suite that is no
# longer true.
#
# `kind` SAYS WHICH KIND OF FINDING AN ENTRY IS, because a reader who cannot
# tell will write a test that asserts nothing:
#   missing_case - behaviour nothing asserts. A case is owed and the expiry
#                  says when.
#   equivalent   - the change cannot alter any observable result, so no case
#                  can kill it. **A finding about the production code**, not
#                  about the tests: an unreachable branch is dead code wearing
#                  a condition. Section 15.3.
#
# `digest` IS THE BASELINE THIS MODULE'S SURVIVORS WERE MEASURED AGAINST, and
# the audit refuses to mutate a module that does not hash to it. A backup is
# self-consistent and preserves damage faithfully: a module an earlier run
# left unparsed passes the control gate, because unparsing is idempotent.
# Section 15.10.
#
# SO AN EDIT TO AN AUDITED MODULE INVALIDATES ITS DECLARATIONS, deliberately.
# A survivor describes a specific body of code, and re-measuring is what makes
# the declaration true again.
survivors:
  cmn/verdict.py:
    digest: 3fe07d74bf5e34f19d79ce555176567de1453d051e3fa514f4364ab17583d5ff
    accepted:
      - mutation: "line 734: False to True"
        kind: equivalent
        reason: >-
          The V2 pass-floor rule returns no breach when there is no rate to
          compare. A run with no rate has no executions, so V5 has already
          fired and the verdict is red either way; flipping this adds a V2 to
          `breached_rules` on a run nobody reads that list from. Recorded
          rather than asserted because the assertion would pin a breach list
          on a path whose only reader is this file.
        expires_on: 2026-12-31
      - mutation: "line 839: True to False"
        kind: equivalent
        reason: >-
          The third `_NOTHING_MEASURED` branch, on an empty skip denominator.
          Every population reaching it with no skippable observations has
          already failed the two branches above it, so the condition is not
          independently reachable. **That is a finding about the code**: the
          branch is unreachable given its predecessors and section 15.3 says
          so rather than a case pretending to cover it.
        expires_on: 2026-12-31
  cmn/threshold_domain.py:
    digest: d254883493eb1c34d3aca3fbc5897cc41b6c5aad2cb1e8448901df25e9645b50
  cmn/layers.py:
    digest: 92f251267b12456eab51f94adfec5b6bd2db0b18bb312b59d5fb12f3fb7d0519
  cmn/registries.py:
    digest: 267717cb33bc0c70a9668369f2af1ddc869381df25a11744eefba2172c1251d2
    accepted:
      - mutation: "line 479: 1 to 2"
        kind: equivalent
        reason: >-
          An unranked code sorts after every ranked group at the last rank plus
          one or plus two alike; the design asks only that it sort last
          (taxonomy section 6.5), and unranked_codes is what fails on one.
        expires_on: 2026-12-31
      - mutation: "line 756: 1 to 2"
        kind: equivalent
        reason: >-
          The stem is the first element of the split, and maxsplit 1 and 2
          give the same first element for every string.
        expires_on: 2026-12-31
      - mutation: "line 833: Or to And"
        kind: equivalent
        reason: >-
          The two guards differ only for a status equal to True, which is 1,
          and the status table holds HTTP codes from 100 up, so the lookup
          returns None either way.
        expires_on: 2026-12-31
  cmn/band_summary.py:
    digest: 0914b06fb036636a6c1942e54fbdba66169e39d582d03a06aea3939632a7b5f0
    accepted:
      - mutation: "line 177: 1 to 2"
        kind: equivalent
        reason: >-
          The code is the first element of split(":", 1), and maxsplit 2 gives
          the same first element for every string.
        expires_on: 2026-12-31
      - mutation: "line 358: 1 to 2"
        kind: equivalent
        reason: >-
          The case name is the last element of rsplit("::", 1), and maxsplit 2
          gives the same last element for every string.
        expires_on: 2026-12-31
  cmn/environments.py:
    digest: d7b1059756dbef7dbfcb242ff26bfd466acc074806b8bdc70ee36c522ac47688
    accepted:
      - mutation: "line 99: 1 to 2"
        kind: unobservable
        reason: >-
          The default root of a sibling lookup moves one directory up. Telling
          the two apart means reading above the repository root, which
          code-style.md section 8.0 forbids a case to do, and on a runner the
          checkout repeats its name so both directories exist (taxonomy
          section 15.3.1).
        expires_on: 2026-12-31
