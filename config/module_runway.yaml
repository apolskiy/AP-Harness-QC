# Modules already past the runway ceiling when the rule was written.
#
# THE RULE IS `code-style.md` SECTION 5.1: at 900 lines a
# module is close enough to the thousand-line hard limit that the next
# subject belongs in a module of its own, named for that subject. The
# margin is room for prose and comments, not a runway for more cases.
#
# A GAP IS A DECLARED ABSENCE, NOT AN EXEMPTION, exactly as
# `support_extraction.yaml` and `flag_coverage.yaml` are: each entry carries
# a reason and an expiry, because a list with no expiry is where oversized
# modules go to be forgotten. An expired entry fails the run.
#
# THE LIST SHRINKS AND NEVER GROWS. A module crossing the ceiling after this
# was written fails until it is split or declared deliberately, and removing
# the last entry deletes the file.
#
# SPLIT BY SUBJECT, NEVER BY NUMBER. `mqc_uni_criticality.py` came out of
# `mqc_uni_metadata.py` because the ranking is its own subject; a
# `_2` suffix would destroy the one-subject-per-module property the
# suite is navigable by.
past_the_runway:
  cmn/config.py:
    reason: "Loading and refusing every configuration file, one subject. 938 lines when the rule was written on 2026-10-05"
    expires_on: 2026-12-31
  cmn/verdict.py:
    reason: "The nine verdict rules and the soundness conditions, one subject. 991 lines when the rule was written on 2026-10-05"
    expires_on: 2026-12-31
  ingestion/schemas.py:
    reason: "Every ingested record's validator, one subject. 989 lines when the rule was written on 2026-10-05"
    expires_on: 2026-12-31
  tests/evaluation/mqc_uni_pipeline.py:
    reason: "The evaluation order end to end. 907 lines when the rule was written on 2026-10-05"
    expires_on: 2026-12-31
  tests/execution/mqc_uni_dispatch.py:
    reason: "Dispatch, pacing and the spend ceiling. 917 lines when the rule was written on 2026-10-05"
    expires_on: 2026-12-31
