# The grouping tree a readiness view is read from: the epic this repository
# publishes under, the capability vocabulary, and which capability each
# collected test module tests.
#
# THE RULE IS `harness_test_taxonomy.md` SECTION 16. The three grouping
# labels are derived at collection from this file and from the test class,
# because the typed form carried 13 of 239 classes while
# `testing-standards.md` section 4 required all three on every one of them.
#
# CAPABILITY NAMES, NOT TIERS, at the project owner's ruling of 2026-10-24. A
# reviewer asks whether the verdict is sound or the mutation audit is honest,
# not whether `cmn` is. The tier is already carried by the module token in
# every identifier and by the suite labels Allure derives from the path.
#
# A MODULE ABSENT FROM `modules` FAILS THE UNIT LAYER, which is the point: a
# new test module declares what it is about at the moment it is written rather
# than being discovered as an unlabelled branch in a report months later.
# `MQC_CMN_UNI_420000` reports the absence and `420001` a value spelled
# outside the vocabulary below.
#
# WHAT IS NOT CHECKED is whether a capability is the right reading of a
# module. That is a judgement, and a check comparing it to anything would be
# comparing it to a second copy of the same judgement (section 16.6).

# The epic every result from this repository carries. Compared with the
# distribution name in `pyproject.toml` by `MQC_CMN_UNI_420002`, so the two
# cannot drift: the epic is what tells a collector reading both repositories
# which one produced a result.
epic: AP-Harness-QC

# The vocabulary. A value in `modules` outside this list is reported, so the
# tree cannot grow a branch by typo.
features:
  - Case ingestion
  - Engine dispatch
  - Judging and scoring
  - Verdict and bands
  - Selection and invocation
  - The result record
  - The readiness view
  - Governance and traceability
  - Project standards
  - The dependency cascade
  - The mutation audit
  - Whole-chain integration

