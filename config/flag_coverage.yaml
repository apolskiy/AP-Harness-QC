# Which side proves each registered flag does something.
#
# THE REGISTRY IS SHARED AND THE TEST TREES ARE NOT. The harness must not read
# the case repository, and the installed wheel ships no tests, so neither side
# can ask about the whole registry. This file says who owns each flag; each
# repository asserts only its own share. `cmn_verdict_and_cli.md` section 7.1.0
# carries the reasoning.
#
# A GAP IS A DECLARED ABSENCE, NOT AN EXEMPTION. It carries a reason and an
# expiry, exactly as `quarantine.yaml` does for a case, because a list with no
# expiry is where unproven flags go to be forgotten and the check stops meaning
# anything once everything inconvenient has left its denominator. An expired
# entry fails the run.
#
# WHAT THIS PROVES AND WHAT IT DOES NOT. Naming a flag in a case does not make
# the case exercise it; it makes the absence arguable rather than silent, which
# is the most a structural check can do. Whether the case is vacuous is settled
# by injection, per `testing-standards.md`.
flags:
  # --- exercised by harness cases -----------------------------------------
  "--engine": {owner: harness}
  "--fill-gaps": {owner: harness}
  "--judge-mode": {owner: harness}
  "--keep-connection": {owner: harness}
  "--mode": {owner: harness}
  "--priority": {owner: harness}
  "--with-prerequisites": {owner: harness}
  "--carry-outcomes": {owner: harness}

  # --- exercised by consumer cases ----------------------------------------
  "--case": {owner: consumer}
  "--judge-on-failure": {owner: consumer}

  # --- declared gaps, dated ------------------------------------------------
  #
  # CLOSED 2026-10-01 by MQC_CAS_UNI_10467. The consumer reads the flag into
  # the dispatch session's ceiling, and that is the half that was broken: the
  # session and the fail-closed rule were already covered by MQC_EXE_UNI_10301
  # and 10303, while nothing proved the flag reached them.
  "--max-spend": {owner: consumer}

  # --- declared gaps, dated ------------------------------------------------
  #
  # A RUN-SHAPING FLAG WITH NO CASE. Each changes what a run measures or where
  # it reports, and none is currently demonstrated by anything.
  "--observations":
    gap:
      reason: >-
        Repeat observations are A4 and the count is configurable, but no case
        varies it and asserts the population changes.
      expires_on: 2026-11-30
  "--golden-rules": {owner: harness}
  "--judge-engine":
    gap:
      reason: >-
        Overrides the configured judge. MQC_CMN_UNI_11190 covers the
        resolution beneath it; nothing covers the flag reaching it.
      expires_on: 2026-11-30
  "--extra-columns": {owner: harness}
  "--as-of":
    gap:
      reason: >-
        Read by the verdict tool as parsed.as_of, so it is acted upon; no case
        passes it on a command line.
      expires_on: 2026-11-30
  # ESTABLISHED 2026-10-01: NO READER ANYWHERE, AND NO IMPLEMENTATION EITHER.
  # Unlike `--extra-columns` there is no behaviour sitting unwired: pytest's own
  # `--junitxml` and `--alluredir` are what the workflows pass and what writes
  # the artifacts. So the question is whether this flag should exist, which is a
  # decision rather than a defect.
  "--out-dir":
    gap:
      reason: >-
        Registered and read by nothing, with no unwired implementation behind
        it. Either it gains behaviour or it is retired and section 7.3 loses
        the row; both need a decision before a case can be written.
      expires_on: 2026-10-31
  # ESTABLISHED 2026-10-01: IT IS A WORKFLOW INPUT AND NOT A PYTEST FLAG.
  # The debug workflow turns it into a `-k` expression before pytest runs, so
  # nothing in either test tree can pass it and reach anything. The coverage
  # question is whether the workflow translates it correctly, which is a
  # workflow case rather than an invocation one.
  "--tests":
    gap:
      reason: >-
        A debug workflow input translated into a selection before pytest sees
        it, so no invocation case can exercise it. What is coverable is the
        workflow's translation.
      expires_on: 2026-11-30
