# Case modules still holding their own support code.
#
# THE RULE IS IN `harness_test_taxonomy.md` SECTION 13: a collected test module
# holds cases, their fixtures and their constants, and the functions and
# classes supporting them live in a sibling module collection never reaches.
#
# A GAP IS A DECLARED ABSENCE, NOT AN EXEMPTION, exactly as
# `flag_coverage.yaml` and `not_rostered` are: each entry carries a reason
# and an expiry, because a list with no expiry is where unconverted modules
# go to be forgotten and the check stops meaning anything once everything
# inconvenient has left its denominator. An expired entry fails the run.
#
# THE LIST SHRINKS AND NEVER GROWS. A new module is born compliant, because
# `MQC_CMN_UNI_112328` and `MQC_CAS_UNI_115711` fail for any collected module
# that holds support and is not named here. Removing the last entry deletes
# the file, which is the finished state.
